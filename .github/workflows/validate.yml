name: validate-infinities

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact/numerical controls
        run: python validation/validate_infinities_v0_1.py
      - name: Run GREMLIN finite-catalog sweep controls
        run: python validation/validate_gremlin_sweep_v0_1.py
      - name: Run BMF v0.4 exact and OOD controls
        run: python validation/validate_bmf_v0_4.py
      - name: Run BMF v0.5 adversarial boundary controls
        run: python validation/validate_bmf_boundary_v0_5.py
      - name: Run v0.6 conditional fourth-operator search controls
        run: python validation/validate_fourth_operator_v0_6.py
      - name: Run BMCF v0.7 polynomial/multilinear controls
        run: python validation/validate_bmcf_v0_7.py
      - name: Run BMCF v0.8 conditional COUPLE obstruction controls
        run: python validation/validate_bmcf_obstruction_v0_8.py
      - name: Run BMCF v0.9 degree-boundary TNT controls
        run: python validation/validate_bmcf_boundary_v0_9.py
      - name: Run BMCF v0.10 final typed-boundary controls
        run: python validation/validate_bmcf_final_boundary_v0_10.py
      - name: Run Infinities v1.0 freeze controls
        run: python validation/validate_v1_0_freeze.py
      - name: Run BMF v1.1 absolute-fold controls
        run: python validation/validate_bmf_infinite_fold_v1_1.py
      - name: Run Euler-Hilbert-Hotel supersymmetry controls v0.1
        run: python validation/validate_euler_hilbert_susy_v0_1.py
      - name: Run Euler-Toeplitz-Hilbert-Hotel supersymmetry controls v0.2
        run: python validation/validate_euler_hilbert_susy_v0_2.py
      - name: Run stable SUSY classification controls v0.3
        run: python validation/validate_euler_hilbert_susy_v0_3.py
      - name: Run SIC-Naimark-McKay SUSY controls v0.5
        run: python validation/validate_euler_hilbert_susy_v0_5.py
      - name: Run TIR SIC-Naimark-CAR supersymmetry controls v0.1
        run: python validation/validate_tir_sic_naimark_car_susy_v0_1.py
      - name: Run TIR Naimark-Fock McKay E6 representation audit v0.1
        run: python validation/validate_tir_naimark_mckay_e6_v0_1.py
      - name: Run TIR C3-untwisted Naimark complement doubled rest-frame audit v0.1
        run: python validation/validate_tir_c3_untwisted_naimark_n2_rest_v0_1.py
      - name: Run TIR C3-compensated affine-E6 operator-support audit v0.1
        run: python validation/validate_tir_c3_e6_graph_dynamics_v0_1.py
      - name: Run Lorentz-transported E6 supertranslation audit v0.1
        run: python validation/validate_tir_lorentz_transported_e6_v0_1.py
      - name: Run C3-resolved N2 long-multiplet audit v0.1
        run: python validation/validate_tir_c3_resolved_n2_long_multiplets_v0_1.py
      - name: Run C3 arm and McKay-index localization audit v0.1
        run: python validation/validate_tir_c3_arm_decomposition_mckay_index_v0_1.py
      - name: Run cyclic-arm affine-E6 criticality audit v0.1
        run: python validation/validate_tir_cyclic_arm_criticality_e6_v0_1.py
      - name: Run TIR C3-untwisted N2 SL2C orbit audit v0.1
        run: python validation/validate_tir_c3_n2_lorentz_orbit_v0_1.py
      - name: Run C6-refined supersymmetry grading audit v0.1
        run: python validation/validate_tir_c6_supergrading_crosswalk_v0_1.py
      - name: Run affine-critical C6 selection audit v0.1
        run: python validation/validate_tir_affine_critical_c6_selection_v0_1.py
      - name: Produce computation snapshot
        run: python computations/run_v0_1.py > computation_snapshot.json
      - name: Produce BMF OOD snapshot
        run: python computations/bmf_ood_v0_4.py > /tmp/bmf_ood_v0_4.stdout.json
      - name: Produce BMF boundary snapshot
        run: python computations/bmf_boundary_v0_5.py > /tmp/bmf_boundary_v0_5.stdout.json
      - name: Produce v0.6 fourth-operator search snapshot
        run: python computations/fourth_operator_search_v0_6.py > /tmp/fourth_operator_search_v0_6.stdout.json
      - name: Produce BMCF v0.7 polynomial snapshot
        run: python computations/bmcf_polynomial_v0_7.py > /tmp/bmcf_polynomial_v0_7.stdout.json
      - name: Produce BMCF v0.8 obstruction snapshot
        run: python computations/bmcf_obstruction_v0_8.py > /tmp/bmcf_obstruction_v0_8.stdout.json
      - name: Produce BMCF v0.9 boundary snapshot
        run: python computations/bmcf_boundary_v0_9.py > /tmp/bmcf_boundary_v0_9.stdout.json
      - name: Produce BMCF v0.10 final-boundary snapshot
        run: python computations/bmcf_final_boundary_v0_10.py > /tmp/bmcf_final_boundary_v0_10.stdout.json
      - name: Produce BMF v1.1 infinite-fold snapshot
        run: python computations/bmf_infinite_fold_v1_1.py > /tmp/bmf_infinite_fold_v1_1.stdout.json
